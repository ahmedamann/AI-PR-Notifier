services:
  app:
    build: .
    container_name: pr-notifier-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: pr-notifier-ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --log=stdout app:8000
    depends_on:
      - app
    ports:
      - "4040:4040"
    restart: unless-stopped
